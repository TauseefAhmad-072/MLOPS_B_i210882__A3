# Least-privilege identity for the agent when it runs in-cluster (namespace-scoped).
apiVersion: v1
kind: ServiceAccount
metadata: {name: mlops-agent, namespace: mlops-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mlops-agent-ops, namespace: mlops-agent}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events, configmaps]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, patch]
  - apiGroups: ["apps"]
    resources: [deployments/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mlops-agent-ops, namespace: mlops-agent}
subjects: [{kind: ServiceAccount, name: mlops-agent, namespace: mlops-agent}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mlops-agent-ops}
